<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Iniciar sesión</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="element-login auth-page">
    <div class="rectangle"></div>

    <div class="login-card auth-card">
      <div class="field-label label-email">Email</div>
      <div class="field-input input-email" id="wrap-email">
        <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email" aria-label="Email" />
      </div>

      <div class="field-label label-password">Password</div>
      <div class="field-input input-password" id="wrap-password">
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" aria-label="Password" />
        <button type="button" class="eye-icon" id="toggle-password" aria-label="Show/hide password">
          <!-- eye open (default) -->
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- eye closed (hidden until toggled) -->
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <p class="field-hint hint">Minimum 8 characters, one uppercase letter, and one number</p>

      <a class="link-accent forgot-password" href="#">Forgot your password?</a>

      <button type="button" class="btn-primary cta-sign-in"><span>Sign in</span></button>

      <p class="text-secondary sign-up-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <div class="login-logo">
      <div class="logo-vector logo-01"><img src="../assets/img/logo-01.svg" alt="" /></div>
      <div class="logo-vector logo-02"><img src="../assets/img/logo-02.svg" alt="" /></div>
      <div class="logo-vector logo-03a"><img src="../assets/img/logo-03.svg" alt="" /></div>
      <div class="logo-vector logo-03b"><img src="../assets/img/logo-03.svg" alt="" /></div>
      <div class="logo-vector logo-04a"><img src="../assets/img/logo-04.svg" alt="" /></div>
      <div class="logo-vector logo-04b"><img src="../assets/img/logo-04.svg" alt="" /></div>
      <div class="logo-vector logo-05"><img src="../assets/img/logo-05.svg" alt="" /></div>
      <div class="logo-vector logo-06a"><img src="../assets/img/logo-06.svg" alt="" /></div>
      <div class="logo-vector logo-06b"><img src="../assets/img/logo-06.svg" alt="" /></div>
      <div class="logo-vector logo-07"><img src="../assets/img/logo-07.svg" alt="" /></div>
      <div class="logo-vector logo-08a"><img src="../assets/img/logo-08.svg" alt="" /></div>
      <div class="logo-vector logo-08b"><img src="../assets/img/logo-08.svg" alt="" /></div>
      <div class="logo-vector logo-09a"><img src="../assets/img/logo-09.svg" alt="" /></div>
      <div class="logo-vector logo-09b"><img src="../assets/img/logo-09.svg" alt="" /></div>
      <div class="logo-vector logo-10a"><img src="../assets/img/logo-10.svg" alt="" /></div>
      <div class="logo-vector logo-10b"><img src="../assets/img/logo-10.svg" alt="" /></div>
      <div class="logo-vector logo-11"><img src="../assets/img/logo-11.svg" alt="" /></div>
      <div class="logo-vector logo-12"><img src="../assets/img/logo-12.svg" alt="" /></div>
      <div class="logo-vector logo-13"><img src="../assets/img/logo-13.svg" alt="" /></div>
      <div class="logo-vector logo-14"><img src="../assets/img/logo-14.svg" alt="" /></div>
      <p class="brand-title logo-name">Nivela</p>
      <div class="logo-vector logo-15"><img src="../assets/img/logo-15.svg" alt="" /></div>
      <p class="logo-tagline">APRENDE A TU RITMO</p>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
