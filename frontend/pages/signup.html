<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Sign up</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <div class="element-signup auth-page">
    <div class="signup-card auth-card">
      <p class="brand-title signup-title">Nivela</p>
      <p class="text-secondary signup-subtitle">Sign up for free</p>

      <p class="text-step-label step-label">Personal information</p>
      <p class="link-accent step-indicator">Step 1 of 3</p>

      <div class="progress-track progress-track-1 is-active"></div>
      <div class="progress-track progress-track-2"></div>
      <div class="progress-track progress-track-3"></div>

      <div class="field-label label-name">Name</div>
      <div class="field-input input-name">
        <div class="field-placeholder">Ana</div>
      </div>

      <div class="field-label label-lastname">Lastname</div>
      <div class="field-input input-lastname">
        <div class="field-placeholder">García</div>
      </div>

      <div class="field-label label-email">Email</div>
      <div class="field-input input-email">
        <div class="field-placeholder">tu@email.com</div>
      </div>

      <div class="field-label label-password">Password</div>
      <div class="field-input input-password">
        <div class="field-placeholder">••••••••</div>
      </div>
      <p class="field-hint hint">Minimum 8 characters, one uppercase letter, and one number</p>

      <div class="field-label label-confirm-password">Confirm Password</div>
      <div class="field-input input-confirm-password">
        <div class="field-placeholder">••••••••</div>
      </div>

      <button type="button" class="btn-primary cta-continue"><span>Continue →</span></button>
    </div>
  </div>
</body>
</html>
