<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Sign up</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/signup.css">
  <script src="../js/theme-init.js"></script>
</head>
<body>
  <!-- WCAG 2.4.1 — Enlace para saltar al formulario -->
  <a href="#main-content" class="skip-link">Saltar al formulario</a>

  <div class="element-signup auth-page">
    <main id="main-content" class="signup-card auth-card" aria-label="Formulario de registro">
      <p class="brand-title signup-title">Nivela</p>
      <p class="text-secondary signup-subtitle">Sign up for free</p>

      <p class="text-step-label step-label">Personal information</p>

      <!-- WCAG 1.3.1 — <label> vinculados con for/id -->
      <label class="field-label label-name" for="signup-name">Name</label>
      <div class="field-input input-name" id="wrap-name">
        <input type="text" id="signup-name" placeholder="Ana"
               autocomplete="given-name"
               aria-required="true"
               aria-describedby="err-name" />
      </div>
      <!-- WCAG 3.3.1 / 4.1.3 — error con role="alert" para anuncio inmediato -->
      <span class="field-msg" id="err-name" role="alert" aria-live="assertive"></span>

      <label class="field-label label-lastname" for="signup-lastname">Lastname</label>
      <div class="field-input input-lastname" id="wrap-lastname">
        <input type="text" id="signup-lastname" placeholder="García"
               autocomplete="family-name"
               aria-required="true"
               aria-describedby="err-lastname" />
      </div>
      <span class="field-msg" id="err-lastname" role="alert" aria-live="assertive"></span>

      <label class="field-label label-email" for="signup-email">Email</label>
      <div class="field-input input-email" id="wrap-email">
        <input type="email" id="signup-email" placeholder="tu@email.com"
               autocomplete="email"
               aria-required="true"
               aria-describedby="err-email" />
      </div>
      <span class="field-msg" id="err-email" role="alert" aria-live="assertive"></span>

      <label class="field-label label-password" for="signup-password">Password</label>
      <div class="field-input input-password" id="wrap-password">
        <input type="password" id="signup-password" placeholder="••••••••"
               autocomplete="new-password"
               aria-required="true"
               aria-describedby="password-hint" />
        <button type="button" class="eye-icon" id="toggle-password" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true" focusable="false">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <!-- WCAG 3.3.2 — instrucción de formato visible antes de enviar -->
      <p class="field-hint hint" id="password-hint" aria-live="polite">
        Minimum 8 characters, one uppercase letter, and one number
      </p>

      <label class="field-label label-confirm-password" for="signup-confirm">Confirm Password</label>
      <div class="field-input input-confirm-password" id="wrap-confirm">
        <input type="password" id="signup-confirm" placeholder="••••••••"
               autocomplete="new-password"
               aria-required="true"
               aria-describedby="err-confirm" />
        <button type="button" class="eye-icon" id="toggle-confirm" aria-label="Mostrar u ocultar confirmación de contraseña">
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true" focusable="false">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <span class="field-msg" id="err-confirm" role="alert" aria-live="assertive"></span>

      <button type="button" class="btn-primary cta-continue"><span>Continue →</span></button>
    </main>
  </div>

  <script src="../js/signup.js"></script>
</body>
</html>
