<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Are you sure you want to exit?</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/exit-modal.css">
  <script src="../js/theme-init.js"></script>
</head>
<body>
  <!-- WCAG 4.1.2 / 1.3.5 — role="dialog" + aria-modal para diálogos de confirmación -->
  <div class="exit-modal-page"
       role="dialog"
       aria-modal="true"
       aria-labelledby="exit-dialog-title">
    <div class="exit-modal-content">
      <button type="button" class="exit-modal-close" aria-label="Close and return to the lesson">×</button>
      <!-- WCAG 3.3.4 — mensaje claro antes de perder progreso (id para aria-labelledby) -->
      <p id="exit-dialog-title" class="exit-modal-text">
        Are you sure you want to exit? You will lose your progress in this assessment.
      </p>
      <div class="exit-modal-actions">
        <button type="button" class="exit-modal-btn exit-modal-btn-confirm"
                aria-label="Confirm exit and lose progress">CONFIRM</button>
        <button type="button" class="exit-modal-btn exit-modal-btn-cancel"
                aria-label="Cancel and return to the lesson">CANCEL</button>
      </div>
    </div>
  </div>
  <script src="../js/exit-modal.js"></script>
  <script>
    /* WCAG 2.1.2 — mover el foco al primer botón al abrir el diálogo */
    document.querySelector('.exit-modal-btn-cancel').focus();
  </script>
</body>
</html>
