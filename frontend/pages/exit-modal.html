<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Are you sure you want to exit?</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/exit-modal.css">
  <script src="../js/theme-init.js"></script>
</head>
<body>
  <div class="exit-modal-page">
    <div class="exit-modal-content">
      <button type="button" class="exit-modal-close" aria-label="Close">×</button>
      <p class="exit-modal-text">Are you sure you want to exit? You will lose your progress in this assessment.</p>
      <div class="exit-modal-actions">
        <button type="button" class="exit-modal-btn exit-modal-btn-confirm">CONFIRM</button>
        <button type="button" class="exit-modal-btn exit-modal-btn-cancel">CANCEL</button>
      </div>
    </div>
  </div>
  <script src="../js/exit-modal.js"></script>
</body>
</html>
