<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Complete the dialogue</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/lesson.css">
  <link rel="stylesheet" href="../css/modal-support.css">
  <script src="../js/theme-init.js"></script>
</head>

<body>
  <!-- WCAG 2.4.1 — Skip to main content -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand" aria-label="Nivela">
        <div class="brand-mark" aria-hidden="true">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" aria-label="Change text size">Aa</button>
        <button type="button" class="header-btn header-btn-icon" aria-label="Toggle dark/light mode">◐</button>
        <a href="profile.html" class="avatar-link">
          <div class="avatar" id="header-avatar" aria-hidden="true">A</div>
        </a>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list" role="navigation">
          <a class="nav-item is-active" href="dashboard.html" aria-label="Home">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" aria-hidden="true" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html" aria-label="Challenges">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" aria-hidden="true" />
            <span>Challenges</span>
          </a>
          <a class="nav-item" href="units.html" aria-label="Units">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" aria-hidden="true" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html" aria-label="Accessibility">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" aria-hidden="true" />
            <span>Accesibility</span>
          </a>
        </nav>
        <a class="nav-item nav-footer-item" href="modal-support.html" aria-label="Help">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" aria-hidden="true" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content lesson-main" id="main-content">
        <div class="lesson-top-bar">
          <button type="button" class="lesson-close" id="close-btn" aria-label="Exit lesson">
            <img src="../assets/img/icon-close.svg" alt="" aria-hidden="true" />
          </button>
          <div class="progress-track lesson-progress-track"
               role="progressbar"
               aria-valuenow="66"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-label="Lesson progress" tabindex="0">
            <div class="progress-fill" id="lesson-progress-fill" style="width: 66%"></div>
          </div>
          <div class="lesson-hearts" aria-label="5 lives remaining" tabindex="0">
            <img src="../assets/img/icon-heart.svg" alt="" aria-hidden="true" />
            <span aria-hidden="true">5</span>
          </div>
        </div>

        <!-- Step badge -->
        <p class="lesson-step-badge" tabindex="0">Exercise 3 of 3 — Dialogue</p>

        <!-- Dialogue exercise -->
        <div class="lesson-exercise dialogue-exercise">
          <div class="dialogue-header">
            <h1 class="lesson-instruction" id="dialogue-instruction" tabindex="0">Complete the conversation by choosing the correct
              options.</h1>
            <div class="dialogue-chars-row" id="dialogue-chars-row"></div>
          </div>

          <!-- Chat scroll area -->
          <div class="dialogue-chat" id="dialogue-chat" aria-live="polite" aria-label="Conversation" tabindex="0"></div>

          <!-- Choice buttons (appear at decision points) -->
          <fieldset class="dialogue-choices" id="dialogue-choices" style="display:none">
            <legend class="sr-only">Choose the correct answer</legend>
          </fieldset>
        </div>

        <!-- Bottom bar: CONTINUE appears at the end -->
        <div class="lesson-bottom-bar lesson-bottom-bar-end">
          <button type="button" class="btn-success" id="continue-btn" style="display:none">FINISH LESSON</button>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/exercises-data.js"></script>
  <script src="../js/header-controls.js"></script>
  <script src="../js/lesson-dialogue.js"></script>
  <script src="../js/modal-support.js"></script>
</body>

</html>
