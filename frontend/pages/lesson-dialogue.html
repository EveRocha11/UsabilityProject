<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Complete the dialogue</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/lesson.css">
</head>
<body>
  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-mark">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn">Aa</button>
        <button type="button" class="header-btn header-btn-icon">◐</button>
        <div class="avatar" id="header-avatar">A</div>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar">
        <nav class="nav-list">
          <a class="nav-item is-active" href="dashboard.html">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" />
            <span>Challenges</span>
          </a>
          <a class="nav-item" href="units.html">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" />
            <span>Accesibility</span>
          </a>
        </nav>
        <a class="nav-item nav-footer-item" href="#">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content lesson-main">
        <div class="lesson-top-bar">
          <button type="button" class="lesson-close" id="close-btn" aria-label="Close">
            <img src="../assets/img/icon-close.svg" alt="" />
          </button>
          <div class="progress-track lesson-progress-track">
            <div class="progress-fill" id="lesson-progress-fill" style="width: 66%"></div>
          </div>
          <div class="lesson-hearts">
            <img src="../assets/img/icon-heart.svg" alt="" />
            <span>5</span>
          </div>
        </div>

        <!-- Step badge -->
        <p class="lesson-step-badge">Exercise 3 of 3 — Dialogue</p>

        <!-- Dialogue exercise -->
        <div class="lesson-exercise dialogue-exercise">
          <div class="dialogue-header">
            <p class="lesson-instruction" id="dialogue-instruction">Complete the conversation by choosing the correct options.</p>
            <div class="dialogue-chars-row" id="dialogue-chars-row"></div>
          </div>

          <!-- Chat scroll area -->
          <div class="dialogue-chat" id="dialogue-chat" aria-live="polite" aria-label="Conversation"></div>

          <!-- Choice buttons (appear at decision points) -->
          <fieldset class="dialogue-choices" id="dialogue-choices" style="display:none">
            <legend class="sr-only">Choose the correct answer</legend>
          </fieldset>
        </div>

        <!-- Bottom bar: CONTINUE appears at the end -->
        <div class="lesson-bottom-bar lesson-bottom-bar-end">
          <button type="button" class="btn-success" id="continue-btn" style="display:none">FINISH LESSON</button>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/exercises-data.js"></script>
  <script src="../js/lesson-dialogue.js"></script>
</body>
</html>
