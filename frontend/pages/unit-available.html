<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Unit</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/unit-detail.css">
  <link rel="stylesheet" href="../css/modal-support.css">
</head>

<body>
  <!-- WCAG 2.4.1 — Saltar al contenido principal -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="dashboard-page">

    <header class="dashboard-header" role="banner">
      <div class="brand" aria-label="Nivela">
        <div class="brand-mark" aria-hidden="true">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" aria-label="Text size settings">Aa</button>
        <button type="button" class="header-btn header-btn-icon" aria-label="Toggle dark mode">◐</button>
        <a href="profile.html" class="avatar-link" aria-label="Profile">
          <div class="avatar" aria-hidden="true">A</div>
        </a>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list" role="navigation">
          <a class="nav-item" href="dashboard.html" aria-label="Home">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" aria-hidden="true" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html" aria-label="Challenges">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" aria-hidden="true" />
            <span>Challenges</span>
          </a>
          <a class="nav-item is-active" href="units.html" aria-current="page" aria-label="Units, current section">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" aria-hidden="true" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html" aria-label="Accessibility settings">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" aria-hidden="true" />
            <span>Accessibility</span>
          </a>
        </nav>

        <a class="nav-item nav-footer-item" href="modal-support.html" aria-label="Help">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" aria-hidden="true" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content" id="main-content">

        <!-- Banner: back button + title + optional padlock for locked units -->
        <div class="unit-banner" role="region" aria-labelledby="unit-banner-title">
          <a href="units.html" class="unit-back-btn" aria-label="Back to Units overview">
            <span aria-hidden="true">&#8592;</span>
            Back
          </a>
          <h1 id="unit-banner-title">Unit</h1>
          <img id="unit-banner-lock" class="unit-banner-lock" src="../assets/img/icon-padlock.svg"
            alt="This unit's lessons are locked" style="display:none" />
        </div>

        <!-- Grammar section -->
        <section aria-labelledby="grammar-heading">
          <h2 id="grammar-heading" class="section-title">Grammar and Structures</h2>
          <div class="grammar-card">
            <ul id="grammar-list" class="grammar-list" aria-label="Grammar topics covered in this unit">
              <!-- Populated by unit-detail.js -->
            </ul>
          </div>
        </section>

        <!-- Lessons section -->
        <section aria-labelledby="lessons-heading">
          <h2 id="lessons-heading" class="section-title">Lessons</h2>
          <div id="lessons-row" class="lessons-row" role="list" aria-label="Lessons in this unit">
            <!-- Populated by unit-detail.js -->
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="../js/header-controls.js"></script>
  <script src="../js/units-data.js"></script>
  <script src="../js/unit-detail.js"></script>
  <script src="../js/modal-support.js"></script>
</body>

</html>
