<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Repeat this sentence</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/lesson.css">
  <script src="../js/theme-init.js"></script>
</head>

<body>
  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand" aria-label="Nivela">
        <div class="brand-mark" aria-hidden="true">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" aria-label="Cambiar tamaño de texto">Aa</button>
        <button type="button" class="header-btn header-btn-icon" aria-label="Alternar modo oscuro/claro">◐</button>
        <div class="avatar" id="header-avatar" aria-hidden="true">A</div>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar" aria-label="Navegación principal">
        <nav class="nav-list" role="navigation">
          <a class="nav-item is-active" href="dashboard.html" aria-label="Inicio">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" aria-hidden="true" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html" aria-label="Desafíos">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" aria-hidden="true" />
            <span>Challenges</span>
          </a>
          <a class="nav-item" href="units.html" aria-label="Unidades">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" aria-hidden="true" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html" aria-label="Accesibilidad">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" aria-hidden="true" />
            <span>Accesibility</span>
          </a>
        </nav>

        <a class="nav-item nav-footer-item" href="#" aria-label="Ayuda">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" aria-hidden="true" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content lesson-main" id="main-content">
        <div class="lesson-top-bar">
          <button type="button" class="lesson-close" id="close-btn" aria-label="Salir de la lección">
            <img src="../assets/img/icon-close.svg" alt="" aria-hidden="true" />
          </button>
          <div class="progress-track lesson-progress-track"
               role="progressbar"
               aria-valuenow="0"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-label="Progreso de la lección">
            <div class="progress-fill" id="lesson-progress-fill" style="width: 0%"></div>
          </div>
          <div class="lesson-hearts" aria-label="5 corazones restantes">
            <img src="../assets/img/icon-heart.svg" alt="" aria-hidden="true" />
            <span aria-hidden="true">5</span>
          </div>
        </div>

        <div class="lesson-exercise">
          <p class="lesson-instruction">Repeat this sentence</p>

          <div class="lesson-exercise-row">
            <div class="lesson-avatar-box">
              <div class="avatar-face">
                <div class="avatar-vector avatar-logo-02"><img src="../assets/img/logo-02.svg" alt="Personaje" /></div>
                <div class="avatar-vector avatar-logo-03a"><img src="../assets/img/logo-03.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-03b"><img src="../assets/img/logo-03.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-04a"><img src="../assets/img/logo-04.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-04b"><img src="../assets/img/logo-04.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-05"><img src="../assets/img/logo-05.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-06a"><img src="../assets/img/logo-06.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-06b"><img src="../assets/img/logo-06.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-07"><img src="../assets/img/logo-07.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-08a"><img src="../assets/img/logo-08.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-08b"><img src="../assets/img/logo-08.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-09a"><img src="../assets/img/logo-09.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-09b"><img src="../assets/img/logo-09.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-10a"><img src="../assets/img/logo-10.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-10b"><img src="../assets/img/logo-10.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-11"><img src="../assets/img/logo-11.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-12"><img src="../assets/img/logo-12.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-13"><img src="../assets/img/logo-13.svg" alt="" /></div>
                <div class="avatar-vector avatar-logo-14"><img src="../assets/img/logo-14.svg" alt="" /></div>
              </div>
            </div>

            <div class="lesson-sentence-col">
              <div class="lesson-sentence-row">
                <!-- WCAG 1.1.1 — ícono de altavoz con texto alternativo descriptivo -->
                <img class="lesson-speaker-icon" id="speaker-icon" src="../assets/img/icon-speaker.svg"
                  alt="Escuchar la oración en voz alta" />
                <!-- WCAG 3.1.2 — contenido en inglés marcado con lang="en" -->
                <div class="lesson-sentence-bubble" id="sentence-bubble" lang="en">Her first name is Anna, nice to meet you.</div>
              </div>

              <button type="button" class="lesson-speak-btn" id="speak-btn"
                      aria-label="Activar micrófono para repetir la oración">
                <span class="lesson-speak-btn-icon" aria-hidden="true">
                  <img src="../assets/img/icon-mic.svg" alt="" />
                </span>
                <span id="speak-label">CLICK TO SPEAK</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Bottom bar: shown during exercise -->
        <div class="lesson-bottom-bar" id="bottom-bar">
          <button type="button" class="btn-purple lesson-skip-btn" id="skip-btn">I CAN'T SPEAK RIGHT NOW</button>
          <button type="button" class="btn-success" id="check-btn" disabled>CHECK</button>
        </div>

        <!-- WCAG 4.1.3 — role="alert" anuncia el feedback al aparecer -->
        <div id="feedback-section" class="lesson-feedback-section" style="display:none"
             role="alert" aria-live="assertive" aria-atomic="true">
          <p class="lesson-feedback-label" id="feedback-label">Feedback</p>
          <div class="lesson-feedback-card" id="feedback-card">
            <img class="lesson-feedback-icon" id="feedback-icon" src="../assets/img/icon-check-circle.svg" alt="" aria-hidden="true" />
            <div class="lesson-feedback-text">
              <p class="lesson-feedback-title" id="feedback-title">Great job, you did well</p>
              <p class="lesson-feedback-subtitle" id="feedback-subtitle">Keep going</p>
            </div>
            <button type="button" class="btn-success" id="continue-btn">CONTINUE</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/lesson.js"></script>
</body>

</html>
