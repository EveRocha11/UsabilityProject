<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Fill in the blank</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/lesson.css">
  <link rel="stylesheet" href="../css/modal-support.css">
  <script src="../js/theme-init.js"></script>
</head>

<body>
  <!-- WCAG 2.4.1 — Saltar al contenido principal -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand" aria-label="Nivela">
        <div class="brand-mark" aria-hidden="true">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" aria-label="Change text size">Aa</button>
        <button type="button" class="header-btn header-btn-icon" aria-label="Toggle dark/light mode">◐</button>
        <div class="avatar" id="header-avatar" aria-hidden="true">A</div>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list" role="navigation">
          <a class="nav-item is-active" href="dashboard.html" aria-label="Home">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" aria-hidden="true" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html" aria-label="Challenges">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" aria-hidden="true" />
            <span>Challenges</span>
          </a>
          <a class="nav-item" href="units.html" aria-label="Units">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" aria-hidden="true" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html" aria-label="Accessibility">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" aria-hidden="true" />
            <span>Accesibility</span>
          </a>
        </nav>
        <a class="nav-item nav-footer-item" href="modal-support.html" aria-label="Help">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" aria-hidden="true" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content lesson-main" id="main-content">
        <div class="lesson-top-bar">
          <button type="button" class="lesson-close" id="close-btn" aria-label="Exit lesson">
            <img src="../assets/img/icon-close.svg" alt="" aria-hidden="true" />
          </button>
          <div class="progress-track lesson-progress-track"
               role="progressbar"
               aria-valuenow="33"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-label="Lesson progress" tabindex="0">
            <div class="progress-fill" id="lesson-progress-fill" style="width: 33%"></div>
          </div>
          <div class="lesson-hearts" aria-label="5 lives remaining" tabindex="0">
            <img src="../assets/img/icon-heart.svg" alt="" aria-hidden="true" />
            <span aria-hidden="true">5</span>
          </div>
        </div>

        <!-- Step badge -->
        <p class="lesson-step-badge" tabindex="0">Exercise 2 of 3 — Fill in the blank</p>

        <!-- Fill exercise -->
        <div class="lesson-exercise fill-exercise">
          <div class="fill-header">
            <h1 class="lesson-instruction" id="fill-instruction" tabindex="0">Look at the image and complete each sentence.</h1>
            <span class="fill-counter" id="fill-counter">1 / 4</span>
          </div>

          <!-- Visual description card (accessible) -->
          <div class="fill-image-card" id="fill-image-card" tabindex="0">
            <span class="fill-image-label">Visual context</span>
            <p class="fill-image-desc" id="fill-image-desc"></p>
          </div>

          <!-- Sentence with blank -->
          <div class="fill-sentence" id="fill-sentence" aria-live="polite" tabindex="0">
            <span id="fill-before"></span>
            <span class="fill-blank" id="fill-blank">_______</span>
            <span id="fill-after"></span>
          </div>

          <!-- Answer options -->
          <fieldset class="fill-options" id="fill-options">
            <legend class="sr-only">Answer choices</legend>
          </fieldset>
        </div>

        <!-- Bottom bar -->
        <div class="lesson-bottom-bar" id="bottom-bar">
          <button type="button" class="btn-purple lesson-skip-btn" id="skip-btn">SKIP</button>
          <button type="button" class="btn-success" id="check-btn" disabled>CHECK</button>
        </div>

        <!-- WCAG 4.1.3 — role="alert" anuncia el feedback automáticamente al aparecer -->
        <div id="feedback-section" class="lesson-feedback-section" style="display:none"
             role="alert" aria-live="assertive" aria-atomic="true">
          <p class="lesson-feedback-label" id="feedback-label">Feedback</p>
          <div class="lesson-feedback-card" id="feedback-card">
            <!-- WCAG 1.1.1 — ícono decorativo oculto; el título textual transmite la información -->
            <img class="lesson-feedback-icon" id="feedback-icon" src="../assets/img/icon-check-circle.svg" alt="" aria-hidden="true" />
            <div class="lesson-feedback-text">
              <p class="lesson-feedback-title" id="feedback-title">Correct!</p>
              <p class="lesson-feedback-subtitle" id="feedback-subtitle">Keep going</p>
            </div>
            <button type="button" class="btn-success" id="next-btn">NEXT</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/exercises-data.js"></script>
  <script src="../js/lesson-fill.js"></script>
  <script src="../js/modal-support.js"></script>
</body>

</html>
