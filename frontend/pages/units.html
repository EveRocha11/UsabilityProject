<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Units</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/units.css">
  <link rel="stylesheet" href="../css/modal-support.css">
</head>

<body>
  <!-- WCAG 2.4.1 — Saltar al contenido principal -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="dashboard-page">

    <header class="dashboard-header" role="banner">
      <div class="brand" aria-label="Nivela">
        <div class="brand-mark" aria-hidden="true">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn" aria-label="Text size settings">Aa</button>
        <button type="button" class="header-btn header-btn-icon" aria-label="Toggle dark mode">◐</button>
        <a href="profile.html" class="avatar-link">
          <div class="avatar">A</div>
        </a>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="nav-list" role="navigation">
          <a class="nav-item" href="dashboard.html" aria-label="Home">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" aria-hidden="true" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html" aria-label="Challenges">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" aria-hidden="true" />
            <span>Challenges</span>
          </a>
          <a class="nav-item is-active" href="#" aria-current="page" aria-label="Units, current page">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" aria-hidden="true" />
            <span>Units</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html" aria-label="Accessibility settings">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" aria-hidden="true" />
            <span>Accessibility</span>
          </a>
        </nav>
        <a class="nav-item nav-footer-item" href="modal-support.html" aria-label="Help">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" aria-hidden="true" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content" id="main-content">
        <h1 class="units-title">Units</h1>

        <div class="units-grid" role="list" aria-label="Learning units">

          <!-- Decorative vertical line (hidden from screen readers) -->
          <div class="timeline-line" aria-hidden="true"></div>

          <!-- Unit 1 -->
          <span class="timeline-dot is-done" id="unit-dot-1" aria-hidden="true"></span>
          <a id="unit-card-1" class="unit-card" href="unit-available.html?id=1" role="listitem"
            aria-label="Unit 1: Changes, Stories and Experiences. Not started.">
            <div class="unit-card-top">
              <span class="unit-badge" aria-hidden="true">U1</span>
              <span class="unit-status unit-status-available">Start</span>
            </div>
            <div class="unit-card-title">Unit 1</div>
            <div class="unit-card-meta">3 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100" aria-label="Unit 1 progress: 0%">
              <div class="progress-fill" style="width:0%"></div>
            </div>
            <div class="unit-progress-label">0%</div>
          </a>

          <!-- Unit 2 -->
          <span class="timeline-dot is-upcoming" id="unit-dot-2" aria-hidden="true"></span>
          <a id="unit-card-2" class="unit-card is-locked" href="unit-available.html?id=2" role="listitem"
            aria-label="Unit 2: Professional World and Personal Growth. Locked — complete Unit 1 first.">
            <div class="unit-card-top">
              <span class="unit-badge" aria-hidden="true">U2</span>
              <img class="unit-lock-icon" src="../assets/img/icon-padlock.svg" alt="" aria-hidden="true" />
            </div>
            <div class="unit-card-title">Unit 2</div>
            <div class="unit-card-meta">3 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100" aria-label="Unit 2 progress: 0%" style="display:none">
              <div class="progress-fill" style="width:0%"></div>
            </div>
            <div class="unit-progress-label" style="display:none">0%</div>
          </a>

          <!-- Unit 3 -->
          <span class="timeline-dot is-upcoming" id="unit-dot-3" aria-hidden="true"></span>
          <a id="unit-card-3" class="unit-card is-locked" href="unit-available.html?id=3" role="listitem"
            aria-label="Unit 3: Culture, Entertainment and Global Expressions. Locked — complete Unit 2 first.">
            <div class="unit-card-top">
              <span class="unit-badge" aria-hidden="true">U3</span>
              <img class="unit-lock-icon" src="../assets/img/icon-padlock.svg" alt="" aria-hidden="true" />
            </div>
            <div class="unit-card-title">Unit 3</div>
            <div class="unit-card-meta">3 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100" aria-label="Unit 3 progress: 0%" style="display:none">
              <div class="progress-fill" style="width:0%"></div>
            </div>
            <div class="unit-progress-label" style="display:none">0%</div>
          </a>

          <!-- Unit 4 -->
          <span class="timeline-dot is-upcoming" id="unit-dot-4" aria-hidden="true"></span>
          <a id="unit-card-4" class="unit-card is-locked" href="unit-available.html?id=4" role="listitem"
            aria-label="Unit 4: Communication, Relationships and Plans. Locked — complete Unit 3 first.">
            <div class="unit-card-top">
              <span class="unit-badge" aria-hidden="true">U4</span>
              <img class="unit-lock-icon" src="../assets/img/icon-padlock.svg" alt="" aria-hidden="true" />
            </div>
            <div class="unit-card-title">Unit 4</div>
            <div class="unit-card-meta">3 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100" aria-label="Unit 4 progress: 0%" style="display:none">
              <div class="progress-fill" style="width:0%"></div>
            </div>
            <div class="unit-progress-label" style="display:none">0%</div>
          </a>

        </div><!-- /.units-grid -->
      </main>
    </div>
  </div>

  <script src="../js/header-controls.js"></script>
  <script src="../js/units-data.js"></script>
  <script src="../js/units.js"></script>
  <script src="../js/modal-support.js"></script>
</body>

</html>
