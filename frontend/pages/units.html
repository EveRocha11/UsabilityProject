<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Nivela - Units</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/units.css">
</head>
<body>
  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-mark">N</div>
        <span class="brand-name">Nivela</span>
      </div>
      <div class="header-actions">
        <button type="button" class="header-btn">Aa</button>
        <button type="button" class="header-btn header-btn-icon">◐</button>
        <div class="avatar">A</div>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar">
        <nav class="nav-list">
          <a class="nav-item" href="dashboard.html">
            <img class="nav-icon" src="../assets/img/icon-home.svg" alt="" />
            <span>Home</span>
          </a>
          <a class="nav-item" href="challenges.html">
            <img class="nav-icon" src="../assets/img/icon-sword.svg" alt="" />
            <span>Challenges</span>
          </a>
          <a class="nav-item is-active" href="units.html">
            <img class="nav-icon" src="../assets/img/icon-path.svg" alt="" />
            <span>Unit</span>
          </a>
          <a class="nav-item" href="modal-accessibility.html">
            <img class="nav-icon" src="../assets/img/icon-person.svg" alt="" />
            <span>Accesibility</span>
          </a>
        </nav>

        <a class="nav-item nav-footer-item" href="#">
          <img class="help-icon" src="../assets/img/icon-help.svg" alt="" />
          <span>Help</span>
        </a>
      </aside>

      <main class="main-content">
        <h1 class="units-title">Units</h1>

        <div class="units-grid">
          <div class="timeline-line"></div>

          <span class="timeline-dot is-done"></span>
          <a class="unit-card" href="unit-available.html">
            <div class="unit-card-top">
              <span class="unit-badge">U1</span>
              <span class="unit-status unit-status-done">✓ Completado</span>
            </div>
            <div class="unit-card-title">Unit 1</div>
            <div class="unit-card-meta">5 lessons · ~ 30 min</div>
            <div class="progress-track unit-progress-track">
              <div class="progress-fill" style="width: 100%"></div>
            </div>
            <div class="unit-progress-label">100%</div>
          </a>

          <span class="timeline-dot is-done"></span>
          <a class="unit-card" href="unit-locked.html">
            <div class="unit-card-top">
              <span class="unit-badge">U1</span>
              <span class="unit-status unit-status-done">✓ Completado</span>
            </div>
            <div class="unit-card-title">Unit 2</div>
            <div class="unit-card-meta">5 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track">
              <div class="progress-fill is-purple" style="width: 100%"></div>
            </div>
            <div class="unit-progress-label">60%</div>
          </a>

          <span class="timeline-dot is-upcoming"></span>
          <a class="unit-card" href="unit-3.html">
            <div class="unit-card-top">
              <span class="unit-badge">U3</span>
              <span class="unit-status unit-status-progress">En progreso</span>
            </div>
            <div class="unit-card-title">Unit 3</div>
            <div class="unit-card-meta">5 lessons · ~30 min</div>
            <div class="progress-track unit-progress-track">
              <div class="progress-fill" style="width: 50%"></div>
            </div>
            <div class="unit-progress-label">100%</div>
          </a>

          <span class="timeline-dot is-upcoming"></span>
          <div class="unit-card is-locked">
            <div class="unit-card-top">
              <span class="unit-badge">U4</span>
              <img class="unit-lock-icon" src="../assets/img/icon-padlock.svg" alt="Bloqueado" />
            </div>
            <div class="unit-card-title">Unit 4</div>
            <div class="unit-card-meta">Complete the last level</div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
