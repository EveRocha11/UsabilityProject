<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nivela - Support</title>
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/lesson.css">
  <link rel="stylesheet" href="../css/modal-support.css">
  <script src="../js/theme-init.js"></script>
</head>
<body>
  <div class="support-page">
    <div class="support-modal" role="dialog" aria-modal="true" aria-labelledby="support-title">
        <section class="support-banner" aria-label="Welcome video preview">
        <div class="support-banner-copy">
          <h1 id="support-title">¡Bienvenido a Nivela!</h1>
          <p class="support-subtitle">Descubre cómo usar tu plataforma</p>
          <p class="support-duration">Duración: 1 min 45 seg</p>
        </div>

        <div class="support-bear" aria-hidden="true">
          <div class="avatar-face">
            <div class="avatar-vector avatar-logo-02"><img src="../assets/img/logo-02.svg" alt="Personaje" /></div>
            <div class="avatar-vector avatar-logo-03a"><img src="../assets/img/logo-03.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-03b"><img src="../assets/img/logo-03.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-04a"><img src="../assets/img/logo-04.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-04b"><img src="../assets/img/logo-04.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-05"><img src="../assets/img/logo-05.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-06a"><img src="../assets/img/logo-06.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-06b"><img src="../assets/img/logo-06.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-07"><img src="../assets/img/logo-07.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-08a"><img src="../assets/img/logo-08.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-08b"><img src="../assets/img/logo-08.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-09a"><img src="../assets/img/logo-09.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-09b"><img src="../assets/img/logo-09.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-10a"><img src="../assets/img/logo-10.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-10b"><img src="../assets/img/logo-10.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-11"><img src="../assets/img/logo-11.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-12"><img src="../assets/img/logo-12.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-13"><img src="../assets/img/logo-13.svg" alt="" /></div>
            <div class="avatar-vector avatar-logo-14"><img src="../assets/img/logo-14.svg" alt="" /></div>
          </div>
        </div>

        <button type="button" class="support-play-main" aria-label="Play preview">
          <span class="support-play-main-ring"></span>
          <span class="support-play-main-core">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5.5v13l11-6.5-11-6.5z" />
            </svg>
          </span>
        </button>

        <div class="support-controls" aria-label="Video controls">
          <button type="button" class="support-control support-control-play" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M8 5.5v13l11-6.5-11-6.5z" />
            </svg>
          </button>

          <span class="support-time support-time-current">0:00</span>

          <div class="support-progress" aria-hidden="true">
            <div class="support-progress-track"></div>
            <div class="support-progress-fill"></div>
            <span class="support-progress-thumb"></span>
          </div>

          <span class="support-time support-time-total">1:45</span>

          <button type="button" class="support-control support-control-volume" aria-label="Volume">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 9v6h4l5 4V5L8 9H4z" />
              <path d="M17 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M19.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>

          <button type="button" class="support-control support-control-fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 9V4h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M20 9V4h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 15v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </section>

      <button type="button" class="support-skip">SKIP</button>
    </div>
  </div>
</body>
</html>
